name: Deploy

# Pull requests get a plan so the change can be reviewed. A push to main (or a
# manual run) applies it, then publishes the frontend.

on:
  push:
    branches: [main]
    paths:
      - "infrastructure/**"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "infrastructure/**"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: cloudvault-deploy
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

defaults:
  run:
    working-directory: infrastructure

jobs:
  plan:
    name: Plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Debug OIDC claims (temporary)
        run: |
          TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | awk '{ while (length($0) % 4) $0 = $0 "="; print }' | base64 -d | jq '{sub, aud, iss, repository, ref, event_name, environment}'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=cloudvault/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Validate
        run: terraform validate

      - name: Plan
        run: |
          terraform plan -no-color -var="aws_region=${{ vars.AWS_REGION }}" | tee plan.txt
          {
            echo '### Terraform plan'
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Apply and publish
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: poc
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=cloudvault/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Validate
        run: terraform validate

      - name: Apply
        run: terraform apply -auto-approve -no-color -var="aws_region=${{ vars.AWS_REGION }}"

      # The page reads its API address and Cognito client from config.js, which
      # only exists after the infrastructure does.
      - name: Write frontend config
        run: |
          cat > ../frontend/config.js <<EOF
          window.CLOUDVAULT_CONFIG = {
            apiBase: "$(terraform output -raw api_url)",
            cognitoRegion: "$(terraform output -raw region)",
            cognitoClientId: "$(terraform output -raw cognito_client_id)"
          };
          EOF

      - name: Publish frontend
        run: |
          aws s3 sync ../frontend "s3://$(terraform output -raw site_bucket)" \
            --delete --exclude "config.example.js"
          aws cloudfront create-invalidation \
            --distribution-id "$(terraform output -raw cloudfront_distribution_id)" \
            --paths "/*" > /dev/null

      - name: Summary
        run: |
          {
            echo "### Deployed"
            echo "App: $(terraform output -raw site_url)"
            echo "API: $(terraform output -raw api_url)"
          } >> "$GITHUB_STEP_SUMMARY"
