name: Destroy

# Tears the whole stack down to stop all charges. Manual only, and it has to be
# confirmed by typing the environment name.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type the environment name (poc) to confirm"
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: cloudvault-deploy
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

defaults:
  run:
    working-directory: infrastructure

jobs:
  destroy:
    name: Destroy
    if: inputs.confirm == 'poc'
    runs-on: ubuntu-latest
    environment: poc
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=cloudvault/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Destroy
        run: terraform destroy -auto-approve -no-color -var="aws_region=${{ vars.AWS_REGION }}"
