<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CloudVault AI — Shared File</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#060a10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060a10;
    --glass: rgba(16, 28, 38, 0.55);
    --border: rgba(0, 229, 255, 0.16);
    --cyan: #22e2ff;
    --text: #d9f4f9;
    --text-dim: #6d8994;
    --danger: #ff6b7a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse 900px 500px at 50% -10%, rgba(0,229,255,0.07), transparent), var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: var(--glass);
    backdrop-filter: blur(16px);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 36px;
    max-width: 480px;
    width: 100%;
  }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--cyan);
    margin-bottom: 10px;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px;
    margin: 0 0 18px;
    word-break: break-word;
  }
  .summary {
    font-size: 14px;
    line-height: 1.6;
    color: var(--text);
    opacity: 0.85;
    white-space: pre-wrap;
    margin-bottom: 24px;
  }
  button {
    background: var(--cyan);
    color: #04141a;
    border: none;
    padding: 12px 24px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    width: 100%;
  }
  button:hover { background: #6febff; }
  .brand-row { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
  .brand-name {
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 17px;
    background: linear-gradient(135deg, #eaffff, #22e2ff); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .summary-label {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px;
  }
  .footer-note { margin-top: 18px; text-align: center; font-size: 12px; color: var(--text-dim); }
  button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  .error { color: var(--danger); font-size: 14px; }
  .loading { color: var(--text-dim); font-family: 'IBM Plex Mono', monospace; font-size: 13px; }
</style>
</head>
<body>

<div class="card" id="card">
  <div class="brand-row">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
      <defs>
        <linearGradient id="logoGradShare" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#22e2ff"/>
          <stop offset="1" stop-color="#4dffb0"/>
        </linearGradient>
      </defs>
      <path d="M12 2L3 7v10l9 5 9-5V7l-9-5z" fill="url(#logoGradShare)" fill-opacity="0.14" stroke="url(#logoGradShare)" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M3 7l9 5 9-5" stroke="url(#logoGradShare)" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M12 12v10" stroke="url(#logoGradShare)" stroke-width="1.6" stroke-linejoin="round" stroke-opacity="0.5"/>
    </svg>
    <span class="brand-name">CloudVault AI</span>
  </div>
  <div class="eyebrow">// shared with you</div>
  <div class="loading" id="content">Loading shared file…</div>
  <div class="footer-note">This link was shared by a CloudVault AI user and expires automatically.</div>
</div>

<script src="config.js"></script>
<script>
  const API_BASE = window.CLOUDVAULT_CONFIG.apiBase;

  async function loadShare() {
    const params = new URLSearchParams(window.location.search);
    const shareId = params.get('id');
    const content = document.getElementById('content');

    if (!shareId) {
      content.classList.remove('loading');
      content.innerHTML = '<div class="error">No share link provided.</div>';
      return;
    }

    try {
      const res = await fetch(`${API_BASE}/shared-file?share_id=${encodeURIComponent(shareId)}`);
      const data = await res.json();

      if (!res.ok) {
        content.classList.remove('loading');
        content.innerHTML = `<div class="error">${escapeHtml(data.error || 'This link is invalid or has expired.')}</div>`;
        return;
      }

      content.classList.remove('loading');
      content.innerHTML = `
        <h1>${escapeHtml(data.filename)}</h1>
        ${data.summary ? `<div class="summary-label">AI summary</div><div class="summary">${escapeHtml(data.summary)}</div>` : ''}
        <button id="downloadBtn">Download</button>
      `;
      document.getElementById('downloadBtn').addEventListener('click', () => {
        const a = document.createElement('a');
        a.href = data.downloadUrl;
        a.download = data.filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
      });
    } catch (err) {
      content.classList.remove('loading');
      content.innerHTML = '<div class="error">Could not load this shared file.</div>';
      console.error(err);
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  loadShare();
</script>

</body>
</html>
